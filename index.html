<!DOCTYPE html>
<html>
<head>
  <title>Multi-page AI Website Generator</title>
  <style>
    body { font-family: Arial; padding: 40px; background: #f8f8f8; }
    h1 { color: #333; }
    form { background: white; padding: 20px; border-radius: 10px; max-width: 400px; }
    select, button { width: 100%; padding: 10px; margin-top: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Multi-page AI Website Generator</h1>
  <form method="POST">
    <label for="business_type">Choose a business type:</label>
    <select name="business_type" required>
      <option value="">--Select--</option>
      <option value="portfolio">Portfolio</option>
      <option value="restaurant">Restaurant</option>
      <option value="ecommerce">E-commerce</option>
      <option value="agency">Agency</option>
    </select>
    <button type="submit">Generate & Download Website</button>
  </form>
</body>
</html>
